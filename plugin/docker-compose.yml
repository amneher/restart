services:

  # ── WordPress nginx ────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.15.12-alpine
    restart: unless-stopped
    ports:
      - "8083:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - wordpress:/var/www/html
      - .:/var/www/html/wp-content/plugins/restart-registry:ro
      - ../the-restart-theme:/var/www/html/wp-content/themes/theRestart:ro
    networks:
      - restart-dev

  # ── WordPress FPM ──────────────────────────────────────────────────────────
  wordpress:
    depends_on:
      database:
        condition: service_healthy
    image: wordpress:6.9.1-fpm-alpine
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
      WP_ENVIRONMENT_TYPE: local
      RESTART_LAMBDA_URL: http://lambda:5000
    volumes:
      - wordpress:/var/www/html
      - .:/var/www/html/wp-content/plugins/restart-registry:rw
      - ../the-restart-theme:/var/www/html/wp-content/themes/theRestart:ro
    networks:
      - restart-dev

  # ── MySQL ──────────────────────────────────────────────────────────────────
  database:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-wordpress}
      MYSQL_USER: ${DB_USER:-wordpress}
      MYSQL_PASSWORD: ${DB_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      timeout: 20s
      retries: 10
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - restart-dev

  # ── Lambda / FastAPI ───────────────────────────────────────────────────────
  lambda:
    image: python:3.14-slim
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "pip install uv -q &&
             uv sync --frozen -q &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 5000 --reload"
    environment:
      DATABASE_PATH: /data/registry.db
      WP_BASE_URL: http://nginx
    ports:
      - "5000:5000"
    volumes:
      - ../restart_lambda:/app
      - lambda_data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - restart-dev

volumes:
  dbdata:
  wordpress:
  lambda_data:

networks:
  restart-dev:
    driver: bridge

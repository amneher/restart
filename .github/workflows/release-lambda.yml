name: Release Lambda

on:
  push:
    tags:
      - 'lambda/v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Lambda zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build zip
        run: |
          VERSION="${GITHUB_REF_NAME#lambda/}"
          make lambda-build
          mv lambda/build/lambda.zip "restart-lambda-${VERSION}.zip"
          echo "ZIP_NAME=restart-lambda-${VERSION}.zip" >> "$GITHUB_ENV"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}

name: Test Coverage Reporting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        module: [lambda, plugin, theme]
    
    steps:
    - uses: actions/checkout@v4
    
    # ────────────────────────────────────────────────────────────────────────
    # Lambda Tests (Python + Pytest)
    # ────────────────────────────────────────────────────────────────────────
    
    - name: Set up Python for Lambda
      if: matrix.module == 'lambda'
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: |
          lambda/pyproject.toml
          lambda/uv.lock
    
    - name: Install Lambda dependencies
      if: matrix.module == 'lambda'
      working-directory: ./lambda
      run: |
        pip install uv
        uv sync
    
    - name: Run Lambda tests with coverage
      if: matrix.module == 'lambda'
      working-directory: ./lambda
      run: |
        .venv/bin/pytest \
          --cov=app \
          --cov-report=html:coverage/html \
          --cov-report=cobertura:coverage/cobertura.xml \
          --cov-report=term-missing \
          --junitxml=coverage/junit.xml \
          tests/
    
    - name: Upload Lambda coverage reports
      if: matrix.module == 'lambda' && always()
      uses: actions/upload-artifact@v4
      with:
        name: lambda-coverage-reports
        path: lambda/coverage/
        retention-days: 30
    
    # ────────────────────────────────────────────────────────────────────────
    # Plugin Tests (PHP + PHPUnit)
    # ────────────────────────────────────────────────────────────────────────
    
    - name: Set up PHP for Plugin
      if: matrix.module == 'plugin'
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        tools: composer, phpunit
    
    - name: Install Plugin dependencies
      if: matrix.module == 'plugin'
      working-directory: ./plugin
      run: |
        composer install --no-interaction --prefer-dist
    
    - name: Run Plugin PHP tests with coverage
      if: matrix.module == 'plugin'
      working-directory: ./plugin
      run: |
        ./vendor/bin/phpunit \
          --configuration phpunit.xml \
          --coverage-html coverage/html \
          --coverage-clover coverage/cobertura.xml \
          --log-junit coverage/junit.xml \
          tests/
    
    - name: Set up Node for Plugin JS tests
      if: matrix.module == 'plugin'
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: plugin/package-lock.json
    
    - name: Install Plugin JS dependencies
      if: matrix.module == 'plugin'
      working-directory: ./plugin
      run: npm ci
    
    - name: Run Plugin JS tests with coverage
      if: matrix.module == 'plugin'
      working-directory: ./plugin
      run: |
        npm test -- \
          --coverage \
          --coveragePathIgnorePatterns='node_modules|vendor' \
          --coverageReporters='cobertura' \
          --coverageReporters='html' \
          --coverageDirectory='coverage/js'
    
    - name: Upload Plugin coverage reports
      if: matrix.module == 'plugin' && always()
      uses: actions/upload-artifact@v4
      with:
        name: plugin-coverage-reports
        path: plugin/coverage/
        retention-days: 30
    
    # ────────────────────────────────────────────────────────────────────────
    # Theme Tests (PHP + PHPUnit, JS)
    # ────────────────────────────────────────────────────────────────────────
    
    - name: Set up PHP for Theme
      if: matrix.module == 'theme'
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        tools: composer, phpunit
    
    - name: Install Theme dependencies
      if: matrix.module == 'theme'
      working-directory: ./theme
      run: |
        composer install --no-interaction --prefer-dist
    
    - name: Run Theme PHP tests with coverage
      if: matrix.module == 'theme'
      working-directory: ./theme
      run: |
        ./vendor/bin/phpunit \
          --configuration phpunit.xml.dist \
          --coverage-html coverage/html \
          --coverage-clover coverage/cobertura.xml \
          --log-junit coverage/junit.xml \
          tests/
    
    - name: Set up Node for Theme JS tests
      if: matrix.module == 'theme'
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: theme/package-lock.json
    
    - name: Install Theme JS dependencies
      if: matrix.module == 'theme'
      working-directory: ./theme
      run: npm ci
    
    - name: Run Theme JS tests with coverage
      if: matrix.module == 'theme'
      working-directory: ./theme
      run: |
        npm test -- \
          --coverage \
          --coveragePathIgnorePatterns='node_modules|vendor' \
          --coverageReporters='cobertura' \
          --coverageReporters='html' \
          --coverageDirectory='coverage/js'
    
    - name: Upload Theme coverage reports
      if: matrix.module == 'theme' && always()
      uses: actions/upload-artifact@v4
      with:
        name: theme-coverage-reports
        path: theme/coverage/
        retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────
  # Coverage Comment on PR
  # ──────────────────────────────────────────────────────────────────────────

  coverage-comment:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: test-coverage
    
    permissions:
      pull-requests: write
    
    steps:
    - name: Download all coverage reports
      uses: actions/download-artifact@v4
      with:
        path: coverage-reports
        merge-multiple: true
    
    - name: Parse coverage reports
      id: coverage
      run: |
        # This script parses cobertura XML files and extracts coverage percentages
        # For simplicity, placeholder script - would be implemented in full version
        echo "coverage_summary=Coverage reports generated. See artifacts for details." >> $GITHUB_OUTPUT
    
    - name: Comment PR with coverage summary
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## Test Coverage Report
            
          Coverage reports have been generated and are available in the workflow artifacts.
          
          **Note:** Coverage enforcement is not yet enabled as we work toward the 80% target across all modules.
          
          - **Lambda**: See lambda-coverage-reports artifact
          - **Plugin**: See plugin-coverage-reports artifact  
          - **Theme**: See theme-coverage-reports artifact`
          })

  # ──────────────────────────────────────────────────────────────────────────
  # Coverage Summary Badge
  # ──────────────────────────────────────────────────────────────────────────

  coverage-badge:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: test-coverage
    
    steps:
    - name: Download coverage reports
      uses: actions/download-artifact@v4
      with:
        path: coverage-reports
        merge-multiple: true
    
    # In a full implementation, would parse coverage and generate badge
    # For now, just store reports for manual review
    
    - name: Archive coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports-main
        path: coverage-reports/
        retention-days: 90
